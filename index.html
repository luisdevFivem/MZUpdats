<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101312">
  <title>MZ Updates</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <img class="logo" src="assets/logo.png" alt="Logo MZ" onerror="this.style.display='none'">
      <div>
        <span class="eyebrow">CENTRAL DE ATUALIZAÇÕES</span>
        <h1 id="projeto">MZ Updates</h1>
        <p id="descricao">Carregando informações...</p>
      </div>
    </header>

    <section class="current">
      <div>
        <small>VERSÃO ATUAL</small>
        <strong id="versao">—</strong>
      </div>
      <div class="date">
        <small>ÚLTIMA ATUALIZAÇÃO</small>
        <strong id="data">—</strong>
      </div>
    </section>

    <section>
      <div class="section-title">
        <h2>Histórico de versões</h2>
        <span class="line"></span>
      </div>
      <div id="lista" class="updates"></div>
    </section>
  </main>

  <footer>© <span id="ano"></span> MZ • Atualizações oficiais</footer>
  <script src="script.js"></script>
</body>
</html>
